<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TMNT Raphael – AR</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>

  <!-- A-Frame & AR.js -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/aframe/build/aframe-ar.js"></script>

  <script>
    // Fit & animate component – scales the model to the marker and plays the first animation
    AFRAME.registerComponent('fit', {
      init() {
        this.el.addEventListener('model-loaded', e => {
          const model = e.detail.model;
          const THREE = AFRAME.THREE;

          // Calculate bounding box and center
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());

          // Reposition so the model stands on the marker plane
          model.position.set(-center.x, -box.min.y, -center.z);

          // Scale uniformly to fit within ~1.8 units (adjust as needed)
          const scale = 1.8 / Math.max(size.x, size.y, size.z);
          this.el.object3D.scale.setScalar(scale);

          // Play the first animation clip if available
          if (model.animations && model.animations.length) {
            this.mixer = new THREE.AnimationMixer(model);
            this.mixer.clipAction(model.animations[0]).play();
          }
        });
      },
      tick(time, dt) {
        if (this.mixer) this.mixer.update(dt / 1000);
      }
    });
  </script>
</head>

<body>
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    arjs="
      sourceType: webcam;
      debugUIEnabled: false;
      cameraParametersUrl: https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.8/data/data/camera_para.dat;
    "
  >
    <!-- HIRO marker -->
    <a-marker preset="hiro" smooth="true">
      <!--
        KykTpkg-tech.github.io/teenage_mutant_ninja_turtles_-_raphael.glb
      -->
      <a-entity
        gltf-model="KykTpkg-tech.github.io/raphael.glb"
        fit
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Attribution – required under CC BY 4.0 -->
  <p style="
    position: fixed;
    bottom: 8px;
    left: 10px;
    margin: 0;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font: 12px system-ui, Tahoma, sans-serif;
    pointer-events: none;
    z-index: 999;
  ">
    <a href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/HIRO.jpg"
       target="_blank" style="color:#9ef; pointer-events:auto;">HIRO marker</a>
    ·
    “Teenage Mutant Ninja Turtles – Raphael” by
    <a href="https://skfb.ly/6TRzn" target="_blank" style="color:#9ef; pointer-events:auto;">Hellbrush</a>
    is licensed under
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" style="color:#9ef; pointer-events:auto;">CC BY 4.0</a>
  </p>
</body>
</html>
